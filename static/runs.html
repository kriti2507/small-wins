<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runs — Small Wins</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="back" href="/">← Back</a>
    <h1>Runs</h1>

    <div class="summary-box">
      <div id="graph"></div>
    </div>

    <div class="toolbar">
      <button class="primary" id="add-btn">+ Add entry</button>
    </div>

    <form class="form hidden" id="add-form">
      <label>
        Title
        <input type="text" name="title" placeholder="Morning run" />
      </label>
      <label>
        Distance (km)
        <input type="number" name="distance" step="0.1" min="0" required />
      </label>
      <label>
        Pace (min'sec per km)
        <input
          type="text"
          name="pace"
          placeholder="8'35&quot;"
          pattern="\d+\s*['&quot;:]\s*\d{1,2}\s*&quot;?"
          title="e.g. 8'35&quot; or 8:35"
          required
        />
      </label>
      <label>
        Heart rate (bpm)
        <input type="number" name="heart_rate" step="1" min="0" />
      </label>
      <label>
        Date
        <input type="date" name="date" required />
      </label>
      <div class="toolbar">
        <button type="submit" class="primary">Save</button>
        <button type="button" id="cancel-btn">Cancel</button>
      </div>
    </form>

    <ul class="run-list" id="run-list"></ul>

    <script src="graph.js"></script>
    <script>
      const listEl = document.getElementById("run-list");
      const graphEl = document.getElementById("graph");
      const form = document.getElementById("add-form");

      function renderList(runs) {
        listEl.innerHTML = "";
        const ordered = [...runs].sort((a, b) => (a.date < b.date ? 1 : -1));
        ordered.forEach((run) => {
          const li = document.createElement("li");
          li.className = "run-item";
          const hr = run.heart_rate != null ? `${run.heart_rate} bpm` : "—";
          li.innerHTML =
            `<strong>${run.title || "Untitled run"}</strong>` +
            `<span class="meta">${run.distance} km · ${formatPace(run.pace)}/km · ${hr} · ${run.date}</span>`;
          listEl.appendChild(li);
        });
      }

      function load() {
        fetch("/api/runs")
          .then((r) => r.json())
          .then((runs) => {
            renderGraph(graphEl, runs);
            renderList(runs);
          });
      }

      document.getElementById("add-btn").onclick = () =>
        form.classList.remove("hidden");
      document.getElementById("cancel-btn").onclick = () =>
        form.classList.add("hidden");

      form.onsubmit = (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form).entries());
        const paceSec = parsePace(data.pace);
        if (isNaN(paceSec)) {
          alert("Enter pace as min'sec, e.g. 8'35\" or 8:35");
          return;
        }
        data.pace = paceSec;
        fetch("/api/runs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        })
          .then((r) => r.json())
          .then(() => {
            form.reset();
            form.classList.add("hidden");
            load();
          });
      };

      load();
    </script>
  </body>
</html>
